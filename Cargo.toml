[package]
name = "PassDB"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0-alpha.5", features = [
  "crossterm",
], default-features = false }
clap = { version = "4.5.48", features = ["derive"] }
color-eyre = "0.6.5"
md-5 = "0.10.6"
glob = "0.3.3"
yaml-rust2 = "0.10.4"
tui-input = { version = "0.14.0", features = [
  "crossterm",
], default-features = false }
text_io = "0.1.13"

rusqlite = { version = "0.40.2", features = ["bundled"] }
bloom = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
parquet = "59.2.0"
arrow = "59.2.0"
duckdb = { version = "1.10505.0", features = ["bundled"] }
postgres = "0.19.14"
csv = "1.4.0"
serde_json = "1.0.151"
#arrow-buffer = "59.2.0"
