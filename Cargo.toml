[package]
name = "PassDB"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = {version = "0.30.0-alpha.5", features = ["crossterm"], default-features = false}
clap = { version = "4.5.48", features = ["derive"] }
color-eyre = "0.6.5"
md-5 = "0.10.6"
glob = "0.3.3"
yaml-rust2 = "0.10.4"
tui-input = {version = "0.14.0", features = ["crossterm"], default-features = false}
rayon = "1.11.0"
dashmap = {version = "7.0.0-rc", features = ["rayon"]}


